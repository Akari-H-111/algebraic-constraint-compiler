name: Core checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: python -B -m unittest discover -s tests -p 'test_algebraic.py' -v
      - run: python -B -m unittest discover -s tests -p 'test_workbench.py' -v
      - run: python -B -m unittest discover -s tests -p 'test_deformation.py' -v

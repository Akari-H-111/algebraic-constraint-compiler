name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core:
    # Exact core, verifier, notebook and workbench with the standard library only.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: python -B -m unittest discover -s tests -p 'test*.py' -v

  mcp:
    # Real Streamable HTTP MCP, MCP Apps card, and the simulated Alexa+ host (no skips allowed).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[mcp]'
      - run: |
          python -B -m unittest discover -s tests -p 'test*.py' -v 2>&1 | tee test.log
          ! grep -q "skipped" test.log

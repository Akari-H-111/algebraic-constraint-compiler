<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Show Your Work banner</title>
<style>
:root{--bg:#070a10;--text:#eef2fb;--muted:#9aa6bf;--accent:#27d3ff;--accent2:#5b7cff;--warn:#ffb14a}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg)}
.frame{position:relative;width:1280px;height:400px;overflow:hidden;transform-origin:0 0;
  background:radial-gradient(900px 500px at 12% -20%,#1b2c55 0%,var(--bg) 62%);color:var(--text);
  font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
.left{position:absolute;left:64px;top:62px;width:560px}
.row{display:flex;align-items:center;gap:18px;margin-bottom:18px}
.logo{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;font-size:38px;font-weight:800;color:#061018;
  background:linear-gradient(135deg,var(--accent),var(--accent2))}
h1{font-size:60px;line-height:1;margin:0;letter-spacing:-.035em}
.sub{font-size:28px;color:#cfd7ea;margin:0 0 22px}
.thesis{font-size:21px;font-weight:650;color:var(--muted);margin:0 0 26px}
.thesis span{color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.sim{margin:20px 0 0;font-size:14px;color:var(--muted)}
.chips span{font-size:14px;border:1px solid #26314a;border-radius:999px;padding:6px 12px;color:#cfd7ea;background:rgba(255,255,255,.03)}
.shot{position:absolute;right:56px;top:28px;width:560px;height:346px;border-radius:16px;overflow:hidden;border:1px solid #2a3552;
  background:#111726;box-shadow:0 24px 60px rgba(0,0,0,.55)}
.shot img{position:absolute;display:block;width:980px;left:0;top:0}
.social .frame{height:640px}.social .left{top:170px}.social .shot{top:147px}
</style>
</head>
<body>
<div class="frame" id="frame">
  <div class="left">
    <div class="row"><div class="logo">✓</div><h1>Show Your Work</h1></div>
    <p class="sub">Math answers Alexa+ can prove.</p>
    <p class="thesis">AI <span>interprets</span>. Compiler <span>calculates</span>. Verifier <span>certifies</span>.</p>
    <div class="chips"><span>MCP 2025-11-25 · Streamable HTTP</span><span>MCP Apps card</span><span>Independent verifier</span><span>Exact over ℚ</span></div>
    <p class="sim">Simulated Alexa+ display · not an Amazon product</p>
  </div>
  <div class="shot"><img src="../../docs/images/card-work.png" alt=""></div>
</div>
<script>
if (location.hash === '#social') document.body.classList.add('social');
function fit(){ document.getElementById('frame').style.transform = 'scale(' + (innerWidth / 1280) + ')'; }
addEventListener('resize', fit); fit();
</script>
</body>
</html>

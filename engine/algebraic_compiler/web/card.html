<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Show Your Work certificate</title>
<style>
:root{
  --bg:var(--color-background-primary,#ffffff);
  --bg2:var(--color-background-secondary,#f5f6f8);
  --fg:var(--color-text-primary,#15171c);
  --fg2:var(--color-text-secondary,#5b6170);
  --line:var(--color-border-primary,#e2e5ea);
  --ok:#0f8a5f;--ok-bg:#e6f6ef;
  --warn:#b25e00;--warn-bg:#fff3e0;
  --bad:#c0262d;--bad-bg:#fdecec;
  --info:#2458c6;--info-bg:#eaf0fd;
  --radius:var(--border-radius-lg,14px);
  --sans:var(--font-sans,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif);
  --mono:var(--font-mono,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace);
  color-scheme:light dark;
}
:root[data-theme=dark]{
  --bg:var(--color-background-primary,#12151b);--bg2:var(--color-background-secondary,#1b2029);
  --fg:var(--color-text-primary,#eef1f6);--fg2:var(--color-text-secondary,#a3abbb);--line:var(--color-border-primary,#2b3240);
  --ok:#3ccf91;--ok-bg:#0f2a20;--warn:#ffb14a;--warn-bg:#2d2112;--bad:#ff6b70;--bad-bg:#2e1517;--info:#7aa7ff;--info-bg:#152038;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:var(--color-background-primary,#12151b);--bg2:var(--color-background-secondary,#1b2029);
  --fg:var(--color-text-primary,#eef1f6);--fg2:var(--color-text-secondary,#a3abbb);--line:var(--color-border-primary,#2b3240);
  --ok:#3ccf91;--ok-bg:#0f2a20;--warn:#ffb14a;--warn-bg:#2d2112;--bad:#ff6b70;--bad-bg:#2e1517;--info:#7aa7ff;--info-bg:#152038;}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--sans)}
body.large{font-size:19px}
.card{padding:18px 20px 16px}
.cols{display:block}
@media (min-width:700px){.cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:0 14px;align-items:start}
  .cols .facts{grid-template-columns:1fr;gap:6px;margin-top:10px}
  .cols .fact{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:7px 10px}
  .cols .fact span{text-align:right}}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.chip{display:inline-flex;align-items:center;gap:6px;font-weight:650;font-size:.78em;letter-spacing:.04em;text-transform:uppercase;padding:5px 10px;border-radius:999px}
.tone-success .chip{color:var(--ok);background:var(--ok-bg)}
.tone-warning .chip{color:var(--warn);background:var(--warn-bg)}
.tone-danger .chip{color:var(--bad);background:var(--bad-bg)}
.tone-neutral .chip{color:var(--info);background:var(--info-bg)}
.brand{margin-left:auto;color:var(--fg2);font-size:.78em}
h1{font-size:1.45em;line-height:1.2;margin:4px 0 6px;font-weight:700;letter-spacing:-.01em}
.say{color:var(--fg2);margin:0 0 12px}
.box{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin:10px 0}
.label{font-size:.72em;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--fg2);margin:0 0 6px}
.eq{font-family:var(--mono);font-size:.98em;margin:1px 0;white-space:pre-wrap;word-break:break-word}
.note{font-size:.82em;color:var(--fg2);margin:6px 0 0}
ol.steps{margin:0;padding-left:1.3em}
ol.steps li{margin:4px 0;font-family:var(--mono);font-size:.95em;white-space:pre-wrap;word-break:break-word}
.hint{border-left:3px solid var(--warn);padding:8px 12px;margin:10px 0;background:var(--warn-bg);border-radius:6px;font-size:.93em}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:12px 0 4px}
.fact{border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.fact b{display:block;font-size:.7em;letter-spacing:.07em;text-transform:uppercase;color:var(--fg2);font-weight:700}
.fact span{font-family:var(--mono);font-size:.86em;word-break:break-all}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
button{font:inherit;font-size:.9em;font-weight:600;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:8px 12px;cursor:pointer}
button.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible{outline:2px solid var(--info);outline-offset:2px}
#replay{margin:8px 0 0;font-size:.88em;min-height:1.2em}
#replay.ok{color:var(--ok)}#replay.bad{color:var(--bad)}
.seal{width:34px;height:34px;flex:none}
details{margin-top:10px}summary{cursor:pointer;color:var(--fg2);font-size:.85em}
pre{font-family:var(--mono);font-size:.72em;max-height:220px;overflow:auto;background:var(--bg2);padding:10px;border-radius:8px;border:1px solid var(--line)}
.empty{color:var(--fg2);padding:24px 20px}
</style>
</head>
<body>
<div id="root" class="empty">Waiting for a result from the host…</div>
<script>
'use strict';
(function(){
  const state = {payload:null, args:null, nextId:1, pending:new Map(), hostContext:{}};
  const inHost = window.parent && window.parent !== window;
  const $ = (tag, attrs, ...kids) => { const el = document.createElement(tag); for (const [k,v] of Object.entries(attrs||{})) { if (k === 'class') el.className = v; else if (k.startsWith('on')) el.addEventListener(k.slice(2), v); else el.setAttribute(k, v); } for (const kid of kids.flat()) if (kid != null) el.append(kid.nodeType ? kid : String(kid)); return el; };

  function send(message){ if (inHost) window.parent.postMessage(message, '*'); }
  function request(method, params){
    const id = state.nextId++;
    send({jsonrpc:'2.0', id, method, params});
    return new Promise((resolve, reject) => {
      state.pending.set(id, {resolve, reject});
      setTimeout(() => { if (state.pending.delete(id)) reject(new Error(method + ' timed out')); }, 30000);
    });
  }
  function notify(method, params){ send({jsonrpc:'2.0', method, params: params || {}}); }

  window.addEventListener('message', event => {
    if (inHost && event.source !== window.parent) return;
    const msg = event.data;
    if (!msg || msg.jsonrpc !== '2.0') return;
    if (msg.id !== undefined && !msg.method) {
      const waiter = state.pending.get(msg.id);
      if (!waiter) return;
      state.pending.delete(msg.id);
      msg.error ? waiter.reject(new Error(msg.error.message || 'Host error')) : waiter.resolve(msg.result);
      return;
    }
    switch (msg.method) {
      case 'ui/notifications/tool-input': state.args = (msg.params || {}).arguments || null; break;
      case 'ui/notifications/tool-result': render(msg.params || {}); break;
      case 'ui/notifications/tool-cancelled': showEmpty('The tool call was cancelled.'); break;
      case 'ui/notifications/host-context-changed': applyContext(msg.params || {}); break;
      case 'ui/resource-teardown': if (msg.id !== undefined) send({jsonrpc:'2.0', id:msg.id, result:{}}); break;
      case 'ping': if (msg.id !== undefined) send({jsonrpc:'2.0', id:msg.id, result:{}}); break;
    }
  });

  function applyContext(ctx){
    Object.assign(state.hostContext, ctx);
    if (ctx.theme) document.documentElement.dataset.theme = ctx.theme;
    const vars = ctx.styles && ctx.styles.variables;
    if (vars) for (const [k, v] of Object.entries(vars)) if (v) document.documentElement.style.setProperty(k, v);
    if (state.hostContext.platform === 'tv' || (ctx.containerDimensions && ctx.containerDimensions.width >= 900)) document.body.classList.add('large');
  }

  function showEmpty(text){ const root = document.getElementById('root'); root.className = 'empty'; root.textContent = text; }

  const chipText = {
    unique_solution:'✓ Verified answer', correct:'✓ Correct · verified', all_steps_valid:'✓ Every step verified',
    error_found:'Mistake found · certified', incorrect:'Not quite · certified', no_solution:'No solution · certified',
    no_valid_answer:'No valid answer · certified', infinitely_many:'Many solutions · certified', practice:'Practice · key verified',
    progress:'Notebook · re-verified', history:'Notebook', verified:'✓ Replay verified', rejected:'✗ Replay rejected',
    forgery_rejected:'✓ Forgery rejected', no_claim:'No claim made'
  };

  function seal(tone){
    const color = {success:'var(--ok)', warning:'var(--warn)', danger:'var(--bad)'}[tone] || 'var(--info)';
    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns, 'svg'); svg.setAttribute('viewBox', '0 0 40 40'); svg.setAttribute('class', 'seal'); svg.setAttribute('aria-hidden', 'true');
    svg.innerHTML = '<circle cx="20" cy="20" r="17" fill="none" stroke="' + color + '" stroke-width="2.5" stroke-dasharray="4 2.5"/>' +
      '<circle cx="20" cy="20" r="11" fill="' + color + '" opacity=".16"/>' +
      '<path d="M14 20.5l4 4 8-9" fill="none" stroke="' + color + '" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>';
    return svg;
  }

  function render(result){
    const payload = result.structuredContent || null;
    if (!payload || !payload.view) { showEmpty((result.content && result.content[0] && result.content[0].text) || 'No structured result.'); return; }
    state.payload = payload;
    const v = payload.view, tone = v.tone || 'neutral';
    const root = document.getElementById('root');
    root.className = 'card tone-' + tone;
    root.replaceChildren();
    root.append($('div', {class:'top'}, seal(tone), $('span', {class:'chip'}, chipText[v.verdict] || v.verdict), $('span', {class:'brand'}, 'Show Your Work · exact over ℚ')));
    root.append($('h1', {}, v.title || ''));
    if (v.detail) root.append($('p', {class:'say'}, v.detail));
    const main = $('div', {}), side = $('div', {});
    root.append($('div', {class:'cols'}, main, side));
    const t = v.translation;
    if (t) {
      const box = $('div', {class:'box'}, $('p', {class:'label'}, 'What I understood — please check'));
      if (t.question) box.append($('p', {class:'note', style:'margin:0 0 6px'}, '“' + t.question + '”'));
      if (t.equations) t.equations.forEach((e, i) => box.append($('div', {class:'eq'}, '(' + (i + 1) + ')  ' + e)));
      if (t.steps) t.steps.forEach((line, i) => box.append($('div', {class:'eq'}, 'Line ' + (i + 1) + ':  ' + line.join(' ;  '))));
      box.append($('p', {class:'note'}, 'Unknowns: ' + t.unknowns.join(', ') + ' · ' + t.domain + '. Turning words into equations is the only AI step; everything after is exact and independently checked.'));
      main.append(box);
    }
    if (v.steps && v.steps.length) {
      main.append($('div', {class:'box'}, $('p', {class:'label'}, payload.kind === 'progress' || payload.kind === 'history' ? 'Recent' : 'Proof you can check'),
        $('ol', {class:'steps'}, v.steps.map(s => $('li', {}, s)))));
    }
    if (v.hint) side.append($('div', {class:'hint'}, v.hint));
    if (v.reveal) {
      const out = $('p', {class:'eq', role:'status', hidden:''}, v.reveal);
      const btn = $('button', {onclick: () => { out.hidden = false; btn.remove(); }}, payload.kind === 'practice' ? 'Reveal answer key' : 'Reveal the verified answer');
      side.append($('div', {class:'actions'}, btn), out);
    }
    const facts = v.facts && v.facts.length ? $('div', {class:'facts'}, v.facts.map(f => $('div', {class:'fact'}, $('b', {}, f.label), $('span', {}, f.value)))) : null;
    if (payload.bundle) {
      const status = $('p', {id:'replay', role:'status', 'aria-live':'polite'}, payload.replay ? `Checked by the independent verifier: ${payload.replay.checks_passed}/${payload.replay.checks_total} checks.` : '');
      const replay = $('button', {class:'primary', onclick: () => call('verify_certificate', {bundle: payload.bundle}, status, r => {
        const rep = r.replay || {}; return [rep.certificate_verified, rep.certificate_verified ? `Replayed just now: ${rep.checks_passed}/${rep.checks_total} independent checks passed.` : 'Replay rejected: ' + (rep.message || rep.code)];
      })}, 'Replay verifier');
      const forge = $('button', {onclick: () => call('forgery_check', {bundle: payload.bundle}, status, r => {
        const rep = r.replay || {}; return [!rep.certificate_verified, rep.certificate_verified ? 'UNEXPECTED: forged certificate accepted.' : `Forgery rejected: changed one number, recomputed the hash — still caught (${rep.message || rep.code}).`];
      })}, 'Try a forgery');
      side.append($('div', {class:'actions'}, replay, forge), status);
    }
    if (facts) side.append(facts);
    if (payload.bundle) side.append($('details', {}, $('summary', {}, 'Portable certificate (JSON)'), $('pre', {}, JSON.stringify(payload.bundle, null, 1))));
    reportSize();
  }

  async function call(name, args, statusEl, interpret){
    if (!inHost) { statusEl.textContent = 'Open this card inside an MCP Apps host to call the verifier.'; return; }
    const buttons = document.querySelectorAll('button'); buttons.forEach(b => b.disabled = true);
    statusEl.className = ''; statusEl.textContent = 'Asking the independent verifier…';
    const started = performance.now();
    try {
      const result = await request('tools/call', {name, arguments: args});
      const [ok, text] = interpret(result.structuredContent || {});
      statusEl.className = ok ? 'ok' : 'bad';
      statusEl.textContent = text + ` (${Math.round(performance.now() - started)} ms)`;
    } catch (error) { statusEl.className = 'bad'; statusEl.textContent = 'Verifier unavailable: ' + error.message; }
    finally { buttons.forEach(b => b.disabled = false); reportSize(); }
  }

  let lastSize = '';
  function measure(){
    const root = document.getElementById('root');
    const width = Math.ceil(document.documentElement.scrollWidth);
    const height = Math.ceil(Math.max(root.getBoundingClientRect().height, root.scrollHeight, document.body.scrollHeight));
    if (!height) return;
    const key = width + 'x' + height; if (key === lastSize) return; lastSize = key;
    notify('ui/notifications/size-changed', {width, height});
  }
  function reportSize(){ measure(); [60, 250, 800].forEach(ms => setTimeout(measure, ms)); }
  new ResizeObserver(measure).observe(document.body);

  async function start(){
    if (!inHost) { showEmpty('This is an MCP Apps view. Open it inside an MCP Apps host (Claude, ChatGPT, VS Code, Goose, or the Show Your Work Alexa+ simulator).'); return; }
    try {
      const init = await request('ui/initialize', {appInfo:{name:'show-your-work-card', version:'0.3.2'},
        appCapabilities:{availableDisplayModes:['inline']}, protocolVersion:'2026-01-26'});
      applyContext((init && init.hostContext) || {});
      notify('ui/notifications/initialized', {});
    } catch (error) { showEmpty('Could not connect to the host: ' + error.message); }
  }
  start();
})();
</script>
</body>
</html>
